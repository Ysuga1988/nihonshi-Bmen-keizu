<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>毛利元就 家族系図マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;600;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f9faf9; --paper-soft:#f3f4f2; --card:#ececea; --ink:#2b2f2d; --ink-soft:#847f72; --line:#dcdcd7;
    --celadon:#8a9a8f; --brick:#9c5040;
    --familyA:#2b2f2d; --familyB:#5c6b62; --familyC:#8a9a8f; --familyD:#9c5040; --familyE:#8a8172; --gray:#a19c8e;
    --adoption:#9c5040; /* 養子・養女線の色(家の色とは独立) */
    --gold:#a4926a;
    --c-confirmed:#5c6b62; --c-uncertain:#9c5040; --c-genealogy:#a4926a; --c-unknown:#a19c8e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ font-family:"Zen Kaku Gothic New", sans-serif; color:var(--ink); background:var(--paper); }
  .app{ position:relative; width:100%; border:1px solid var(--line); overflow:hidden; }

  .topbar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:18px 20px 14px; background:var(--paper); color:var(--ink); border-bottom:1px solid var(--ink);
  }
  .title{ font-family:"Zen Old Mincho", serif; font-weight:700; font-size:20px; letter-spacing:.08em; }
  .title [contenteditable]{ outline:none; border-radius:2px; padding:1px 3px; margin:-1px -3px; }
  .title [contenteditable]:hover{ background:var(--paper-soft); }
  .title [contenteditable]:focus{ background:var(--card); box-shadow:0 0 0 1px var(--celadon); }

  .resize-handle{
    height:14px; cursor:ns-resize; display:flex; align-items:center; justify-content:center;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .resize-handle span{ width:36px; height:3px; border-radius:2px; background:var(--line); }
  .resize-handle:hover span{ background:var(--celadon); }
  .resize-handle.dragging span{ background:var(--brick); }
  .title small{ display:block; font-family:"Zen Kaku Gothic New", sans-serif; font-weight:400; font-size:10.5px; color:var(--ink-soft); margin-top:5px; letter-spacing:.02em; }
  .search-wrap{ position:relative; margin-left:auto; width:200px; }
  .search-wrap input{ width:100%; font-size:12.5px; padding:7px 12px; border-radius:0; border:1px solid var(--line); outline:none; background:var(--paper); color:var(--ink); }
  .search-wrap input:focus{ border-color:var(--ink); }
  .search-results{
    position:absolute; top:36px; left:0; right:0; background:var(--card); border:1px solid var(--ink);
    max-height:220px; overflow-y:auto; display:none; z-index:40;
  }
  .search-results div{ padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); border-bottom:1px solid var(--line); }
  .search-results div:hover{ background:var(--paper-soft); }

  .policy{ padding:10px 20px; background:var(--paper-soft); border-bottom:1px solid var(--line); font-size:11.5px; color:var(--ink-soft); line-height:1.7; }
  .policy b{ color:var(--ink); font-weight:500; }

  .legend-row{
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;
    padding:10px 20px; background:var(--paper); border-bottom:1px solid var(--line); font-size:10.5px; color:var(--ink-soft);
  }
  .legend-group{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .legend-group b{ color:var(--ink-soft); margin-right:2px; font-weight:500; }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:0; }
  .lkey{ display:inline-flex; align-items:center; white-space:nowrap; }
  .lline{ width:18px; height:0; border-top:1.5px solid var(--ink-soft); display:inline-block; margin-right:4px; }
  .lline.dashed{ border-top-style:dashed; border-color:var(--adoption); }
  .lline.thin-dashed{ border-top-style:dashed; border-width:1px; }
  .lline.gold{ border-color:var(--gold); border-top-style:dashed; }
  .lbox{ width:14px; height:9px; border:1.4px dashed var(--ink-soft); display:inline-block; margin-right:4px; }
  .pill-sample{ font-size:9px; padding:1px 6px; border-radius:20px; margin-right:4px; background:transparent; border:1px solid currentColor; }

  .viewport{ position:relative; height:640px; overflow:hidden; cursor:grab; background:var(--paper); }
  .viewport.dragging{ cursor:grabbing; }
  .world{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  .world.animating{ transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
  svg.edges{ position:absolute; top:0; left:0; overflow:visible; }
  .edge-label rect{ fill:var(--paper); stroke:var(--line); stroke-width:1; }
  .edge-label text{ fill:var(--ink-soft); font:500 10px "Zen Kaku Gothic New",sans-serif; text-anchor:middle; }

  .node{
    position:absolute; width:158px; padding:10px 11px 9px;
    border-radius:0; background:var(--card);
    border:1px solid var(--line); border-top:2px solid var(--nc, var(--ink));
    box-shadow:0 1px 0 rgba(32,30,26,.04);
    cursor:pointer; transform:translate(-50%,-50%);
    transition:box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .node .fam{ font:500 8.5px "Zen Kaku Gothic New",sans-serif; letter-spacing:.14em; color:var(--nc,var(--ink-soft)); }
  .node .name{ font-family:"Zen Old Mincho", serif; font-weight:600; font-size:15px; margin-top:5px; line-height:1.3; color:var(--ink); letter-spacing:.03em; }
  .node.unnamed .name{ font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:500; color:var(--ink-soft); }
  .node.unnamed{ border-style:dashed; }
  .node .role{ margin-top:5px; font-size:9.5px; color:var(--ink-soft); line-height:1.4; }
  .node .pill{ display:inline-block; margin-top:7px; padding:2px 8px; border-radius:20px; font-size:8.5px; letter-spacing:.03em; background:transparent; border:1px solid currentColor; }

  .node.dim{ opacity:.2; }
  .node.hi{ box-shadow:0 0 0 1px var(--celadon), 0 4px 12px rgba(32,30,26,.14); transform:translate(-50%,-50%) scale(1.05); z-index:10; }
  .node.selected{ box-shadow:0 0 0 1px var(--brick), 0 4px 14px rgba(32,30,26,.16); z-index:11; }

  .house-familyA{ --nc:var(--familyA); } .house-familyB{ --nc:var(--familyB); } .house-familyC{ --nc:var(--familyC); }
  .house-familyD{ --nc:var(--familyD); } .house-familyE{ --nc:var(--familyE); } .house-other{ --nc:var(--gray); }

  .controls{ position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:30; }
  .controls button{ width:36px; height:36px; border-radius:0; border:1px solid var(--ink); background:var(--paper); color:var(--ink); font-size:16px; cursor:pointer; }
  .controls .reset{ font-size:10.5px; font-weight:500; }
  .controls .edit-toggle{ width:auto; padding:0 12px; font-size:10.5px; font-weight:500; white-space:nowrap; letter-spacing:.03em; }
  .controls .edit-toggle.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .edit-panel{
    display:none; position:absolute; left:14px; top:14px; z-index:32;
    background:var(--card); border:1px solid var(--ink);
    padding:14px 16px; box-shadow:0 6px 18px rgba(32,30,26,.12);
    max-width:300px; flex-direction:column; gap:9px;
  }
  .edit-panel p{ margin:0; font-size:11.5px; color:var(--ink-soft); }
  .cascade-label{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink); cursor:pointer; }
  .edit-panel-buttons{ display:flex; gap:8px; flex-wrap:wrap; }
  .edit-panel-buttons button{
    font-size:10.5px; padding:6px 11px; border-radius:20px; border:1px solid var(--ink); letter-spacing:.02em;
    background:var(--ink); color:var(--paper); cursor:pointer;
  }
  .edit-panel-buttons button#resetPositionsBtn{ background:var(--paper); color:var(--ink); }
  #copyOutput{
    display:none; width:100%; height:110px; font-size:10.5px; font-family:monospace;
    padding:8px; border-radius:0; border:1px solid var(--line); resize:vertical; background:var(--paper-soft);
  }

  .viewport.edit-mode{ cursor:default; }
  .viewport.edit-mode .node{ cursor:pointer; }
  .node.being-dragged{ opacity:0.85; z-index:20; box-shadow:0 8px 20px rgba(32,30,26,.2); }
  .node.manual{ border-top-width:2px; box-shadow:0 0 0 1px var(--celadon); }
  .hint{ position:absolute; left:14px; bottom:14px; font-size:10.5px; color:var(--ink-soft); background:rgba(250,248,243,0.9); padding:5px 11px; border:1px solid var(--line); z-index:30; pointer-events:none; }

  .edit-form{
    display:none; position:absolute; top:14px; right:14px; width:280px; max-height:85%; overflow-y:auto;
    background:var(--card); border:1px solid var(--ink);
    box-shadow:0 8px 24px rgba(32,30,26,.14); padding:18px; z-index:36;
  }
  .edit-form.show{ display:block; }
  .edit-form .close{ position:absolute; top:10px; right:12px; cursor:pointer; font-size:14px; color:var(--ink-soft); background:none; border:none; }
  .edit-form h4{ margin:0 0 12px; font-family:"Zen Old Mincho",serif; font-weight:600; font-size:16px; letter-spacing:.04em; }
  .edit-form label{ display:block; font-size:10.5px; color:var(--ink-soft); margin-top:10px; }
  .edit-form label.ef_checkbox{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink); margin-top:10px; }
  .edit-form input[type="text"], .edit-form select, .edit-form textarea{
    width:100%; margin-top:3px; font-size:12px; font-family:"Zen Kaku Gothic New",sans-serif;
    padding:6px 9px; border-radius:0; border:1px solid var(--line); background:var(--paper); color:var(--ink); resize:vertical;
  }
  .edit-form input[type="text"]:focus, .edit-form select:focus, .edit-form textarea:focus{ outline:none; border-color:var(--ink); }
  .edit-form-buttons{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .edit-form-buttons button{
    font-size:10.5px; padding:6px 11px; border-radius:20px; border:1px solid var(--ink); cursor:pointer; letter-spacing:.02em;
  }
  .edit-form-buttons button#ef_save{ background:var(--ink); color:var(--paper); }
  .edit-form-buttons button#ef_resetOne{ background:var(--paper); color:var(--ink); }
  .edit-form-buttons button#ef_delete{ background:var(--paper); color:var(--brick); border-color:var(--brick); margin-left:auto; }
  .ef_delete_confirm{ display:none; margin-top:10px; padding:11px; border-radius:0; background:var(--paper-soft); border:1px solid var(--brick); }
  .ef_delete_confirm.show{ display:block; }
  .ef_delete_confirm p{ margin:0 0 8px; font-size:11px; color:var(--brick); line-height:1.6; }
  .ef_delete_confirm .edit-form-buttons{ margin-top:0; }
  .ef_delete_confirm button#ef_delete_yes{ background:var(--brick); color:var(--paper); border-color:var(--brick); }
  .ef_delete_confirm button#ef_delete_no{ background:var(--paper); color:var(--ink); }
  .ef_relations{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
  .ef_relations_note{ margin:0 0 4px; font-size:10px; color:var(--ink-soft); }
  .ef_relations.disabled{ opacity:0.4; pointer-events:none; }

  .panel{
    position:absolute; top:64px; right:14px; width:270px; max-height:70%; overflow-y:auto;
    background:var(--card); border:1px solid var(--ink);
    box-shadow:0 8px 24px rgba(32,30,26,.14); padding:18px; z-index:35; display:none;
  }
  .panel.show{ display:block; }
  .panel .close{ position:absolute; top:10px; right:12px; cursor:pointer; font-size:14px; color:var(--ink-soft); background:none; border:none; }
  .panel .pname{ font-family:"Zen Old Mincho", serif; font-weight:700; font-size:19px; letter-spacing:.04em; }
  .panel .pname.unnamed{ font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:500; color:var(--ink-soft); }
  .panel .pyomi{ font-family:"Cormorant Garamond",serif; font-style:italic; font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .panel .ptags{ margin-top:10px; }
  .panel .ptag{ display:inline-block; padding:2px 10px; border-radius:20px; font-size:10px; margin:0 6px 6px 0; background:transparent; border:1px solid currentColor; }
  .panel .pnote{ font-size:12.5px; line-height:1.85; color:var(--ink); margin-top:10px; }
  .panel .psources{ margin-top:12px; padding-top:9px; border-top:1px solid var(--line); font-size:10.5px; color:var(--ink-soft); }
  .panel .psources ul{ margin:4px 0 0; padding-left:18px; }

  .list-section{ padding:26px 24px 30px; background:var(--paper); border-top:1px solid var(--ink); }
  .list-section h3{ margin:0 0 5px; font-family:"Zen Old Mincho",serif; font-weight:700; font-size:21px; letter-spacing:.05em; }
  .list-section .lead{ margin:0 0 18px; font-size:11.5px; color:var(--ink-soft); }
  details.person{ margin:0 0 8px; border:1px solid var(--line); border-left:2px solid var(--nc,var(--ink)); background:var(--card); border-radius:0; }
  details.person summary{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:12px 14px; cursor:pointer; font-family:"Zen Kaku Gothic New",sans-serif; }
  details.person summary .dname{ font-family:"Zen Old Mincho",serif; font-size:15px; font-weight:600; letter-spacing:.02em; }
  details.person summary .dname.unnamed{ font-family:"Cormorant Garamond",serif; font-style:italic; font-weight:500; color:var(--ink-soft); }
  details.person summary .drole{ font-size:10.5px; color:var(--ink-soft); }
  details.person .body{ padding:0 16px 16px; border-top:1px solid var(--line); font-size:12.5px; line-height:1.85; }
  details.person .yomi{ font-family:"Cormorant Garamond",serif; font-style:italic; font-size:11.5px; color:var(--ink-soft); letter-spacing:.03em; margin-top:11px; }
  details.person .src{ margin-top:9px; padding-top:7px; border-top:1px solid var(--line); font-size:10.5px; color:var(--ink-soft); }

  @media(max-width:640px){ .viewport{ height:70vh; } .search-wrap{ width:140px; } }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="title"><span id="mainTitle" contenteditable="true" spellcheck="false">毛利元就 家族系図</span><small id="mainSubtitle" contenteditable="true" spellcheck="false">5代前の広房から5代後の長州藩主家まで、自動レイアウト版</small></div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="人物名で検索…">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <div class="legend-row">
    <div class="legend-group"><b>確度:</b>
      <span class="lkey"><i class="pill-sample" style="color:var(--c-confirmed)">関係を確認</i></span>
      <span class="lkey"><i class="pill-sample" style="color:var(--c-genealogy)">系譜類に記載</i></span>
      <span class="lkey"><i class="pill-sample" style="color:var(--c-uncertain)">諸説・要検討</i></span>
      <span class="lkey"><i class="pill-sample" style="color:var(--c-unknown)">氏名・出自不詳</i></span>
    </div>
    <div class="legend-group"><b>線:</b>
      <span class="lkey"><i class="lline"></i>実親子</span>
      <span class="lkey"><i class="lline dashed"></i>養子・養女</span>
      <span class="lkey"><i class="lline gold"></i>婚姻</span>
      <span class="lkey"><i class="lline thin-dashed"></i>前夫婦</span>
      <span class="lkey"><i class="lbox"></i>氏名不詳</span>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="world" id="world">
      <svg class="edges" id="edges"></svg>
      <div id="nodesLayer"></div>
    </div>
    <div class="controls">
      <button id="editModeBtn" class="edit-toggle">編集モード</button>
      <button id="zoomIn">＋</button>
      <button id="zoomOut">－</button>
      <button class="reset" id="resetView">全体</button>
    </div>
    <div class="edit-panel" id="editPanel">
      <p>編集モード中:カードをドラッグで移動、クリックで内容を編集できます。</p>
      <label class="cascade-label"><input type="checkbox" id="cascadeChildren" checked> 子孫も一緒に動かす</label>
      <div class="edit-panel-buttons">
        <button id="addCardBtn">＋ 新しいカードを追加</button>
        <button id="copyPositionsBtn">変更をコピー</button>
        <button id="resetPositionsBtn">動かした位置をリセット</button>
      </div>
      <textarea id="copyOutput" readonly></textarea>
    </div>
    <div class="edit-form" id="editForm">
      <button class="close" id="editFormClose">✕</button>
      <h4 id="ef_title">カードの内容を編集</h4>
      <label>名前<input type="text" id="ef_name"></label>
      <label>肩書き・役割<input type="text" id="ef_role"></label>
      <label>よみ<input type="text" id="ef_yomi"></label>
      <label>家<select id="ef_house"></select></label>
      <label>確度<select id="ef_certainty"></select></label>
      <label class="ef_checkbox"><input type="checkbox" id="ef_unnamed"> 氏名不詳として表示(点線枠)</label>
      <label>説明文<textarea id="ef_note" rows="4"></textarea></label>
      <label>出典(1行に1つ)<textarea id="ef_sources" rows="2"></textarea></label>
      <div id="ef_relations" class="ef_relations">
        <p class="ef_relations_note">この人物の関係(いつでも設定・変更できます)</p>
        <label>父<select id="ef_father"></select></label>
        <label>母<select id="ef_mother"></select></label>
        <label>配偶者<select id="ef_spouse"></select></label>
      </div>
      <div class="edit-form-buttons">
        <button id="ef_save">保存</button>
        <button id="ef_resetOne">このカードをリセット</button>
        <button id="ef_delete">🗑 このカードを削除</button>
      </div>
      <div class="ef_delete_confirm" id="ef_delete_confirm">
        <p>本当に削除しますか?この人物への関係線も削除されます(子孫は削除されず、切り離されます)。</p>
        <div class="edit-form-buttons">
          <button id="ef_delete_yes">削除する</button>
          <button id="ef_delete_no">キャンセル</button>
        </div>
      </div>
    </div>
    <div class="panel" id="panel">
      <button class="close" id="panelClose">✕</button>
      <div class="pname" id="pName"></div>
      <div class="pyomi" id="pYomi"></div>
      <div class="ptags">
        <span class="ptag" id="pHouse"></span>
        <span class="ptag" id="pCertainty"></span>
      </div>
      <div class="pnote" id="pNote"></div>
      <div class="psources" id="pSources"></div>
    </div>
  </div>
  <div class="resize-handle" id="resizeHandle" title="ドラッグで高さを変更"><span></span></div>

  <section class="list-section" id="listSection">
    <h3>人物一覧</h3>
    <p class="lead">系図が読み込めない環境でも内容を確認できるよう、同じ情報をここに一覧で載せています。氏名を押すと詳細が開きます。</p>
    <div id="listContainer"></div>
  </section>
</div>

<script>
/* =========================================================================
   ■ このHTMLは「家系図テンプレート」です。以下を書き換えて別の家系図を作れます。

   1) nodes[] … 1人1オブジェクト。座標(x,y)は指定不要、自動計算されます。
        id        : 半角英数字のユニークID(自分で決める。日本語不可)
        name      : 表示名。氏名不詳の人物は「〇〇の娘」等でも可
        house     : 下の houseColors/houseLabels に定義したキーのいずれか
        role      : カードに出す短い肩書き(空文字可)
        yomi      : 読み仮名(任意、詳細パネルにのみ表示)
        certainty : "confirmed"(関係を確認)|"genealogy"(系譜類に記載)
                    |"uncertain"(諸説・要検討)|"unknown"(氏名・出自不詳)
        unnamed   : true にすると点線枠になり「氏名不詳」の人物として扱われる
        note      : 詳細パネル・下部一覧に出す説明文
        sources   : 出典の配列(空配列可)

   2) parentEdges … [親のid, 子のid, ラベル文字列, "blood"(実子)|"adoption"(養子)]
        親のいない人物は自動的に一番上の世代として扱われます。
        父・母どちらもわかっている場合は2行(父→子、母→子)を追加してください。

   3) spouseEdges … [id1, id2, ラベル文字列, "marriage"(婚姻)|"former"(離別・死別等)]
        配偶者どうしは自動的に同じ世代・隣接する位置に配置されます。
        末尾に5番目の要素として数値を足すと、そのペアだけ間隔を個別指定できます
        (例: ["a","b","婚姻","marriage", 380] のように)。

   4) houseColors / houseLabels … 家ごとの色とラベル。familyA〜familyE と other の
        6つを用意しています。使う家の数に合わせて増減してください(CSSの
        :root 変数 --familyA〜--familyE と .house-familyA〜E クラスも
        合わせて増減・リネームすると綺麗になりますが、必須ではありません)。

   5) certaintyMeta … 確度ラベルの文言と色。基本的にはそのまま使い回せます。

   6) [任意] trunk:true … 主人公の直系(祖先〜子孫)に付けると、その人たちが

/* =========================================================================
   自動レイアウトエンジン
   1) 親子関係だけをたどった「最長経路」で世代(段)を決める
   2) 配偶者(spouseEdges)どうしは同じ段にそろえる(値の大きい方に合わせる)
   3) 上記を安定するまで繰り返す(親→子、配偶者の同段化、を交互に反映)
   4) ルート(親のいない人)から子へ向かって配偶者をまとめながら順番に並べ、
      左右位置の初期値を決める
   5) 下の段から上の段へ向かって「子どもたちの平均位置」に親を寄せ、
      重なった場合は横に押し出して間隔を確保する
   ========================================================================= */
const ROW_H = 270, COL_W = 230, SPOUSE_GAP = 210;

function computeLayout(nodes, parentEdges, spouseEdges){
  const ids = nodes.map(n=>n.id);
  const nodeByIdLocal = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const trunkNodeForHouse = nodes.find(n=>n.trunk);
  const TRUNK_HOUSE = trunkNodeForHouse ? trunkNodeForHouse.house : (nodes[0] && nodes[0].house);
  const parentsOf = {}, childrenOf = {};
  ids.forEach(id=>{ parentsOf[id]=[]; childrenOf[id]=[]; });
  parentEdges.forEach(([p,c])=>{ parentsOf[c].push(p); childrenOf[p].push(c); });

  // 配偶者クラスタ(Union-Find)
  const uf = {}; ids.forEach(id=>uf[id]=id);
  function find(x){ while(uf[x]!==x){ uf[x]=uf[uf[x]]; x=uf[x]; } return x; }
  function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) uf[ra]=rb; }
  spouseEdges.forEach(([a,b])=>union(a,b));
  const pairGap = {};
  spouseEdges.forEach(([a,b,,,gap])=>{ if(gap){ pairGap[a+"|"+b]=gap; pairGap[b+"|"+a]=gap; } });
  const clusters = {};
  ids.forEach(id=>{ const r=find(id); (clusters[r]=clusters[r]||[]).push(id); });
  const clusterOf = {}; ids.forEach(id=>{ clusterOf[id]=find(id); });

  // 世代(段)を緩和法で決定
  const rank = {}; ids.forEach(id=>rank[id]=0);
  for(let iter=0; iter<ids.length+5; iter++){
    let changed=false;
    parentEdges.forEach(([p,c])=>{ if(rank[c] < rank[p]+1){ rank[c]=rank[p]+1; changed=true; } });
    Object.values(clusters).forEach(members=>{
      const m = Math.max(...members.map(id=>rank[id]));
      members.forEach(id=>{ if(rank[id] < m){ rank[id]=m; changed=true; } });
    });
    if(!changed) break;
  }
  // 親を持たない人(ルート)は0段目のままになりがちだが、その子がずっと深い段にいる場合、
  // 子のすぐ上の段まで引き上げる(親子のカードが遠く離れすぎるのを防ぐ)。
  ids.forEach(id=>{
    if(parentsOf[id].length > 0) return;
    const childRanks = childrenOf[id].map(c=>rank[c]);
    if(childRanks.length === 0) return;
    const desired = Math.min(...childRanks) - 1;
    if(desired > rank[id]) rank[id] = desired;
  });
  // 引き上げた分の整合性を取るため、緩和法をもう一度流す(配偶者クラスタの段も揃え直す)
  for(let iter=0; iter<ids.length+5; iter++){
    let changed=false;
    parentEdges.forEach(([p,c])=>{ if(rank[c] < rank[p]+1){ rank[c]=rank[p]+1; changed=true; } });
    Object.values(clusters).forEach(members=>{
      const m = Math.max(...members.map(id=>rank[id]));
      members.forEach(id=>{ if(rank[id] < m){ rank[id]=m; changed=true; } });
    });
    if(!changed) break;
  }
  // 兄弟姉妹(同じ親を持つ子)は、配偶者の血筋の深さに引きずられて段がバラバラにならないよう
  // そろえる。ただし反復させると無限増大の恐れがあるため、1回だけ・浅い方を深い方へ
  // 引き上げる形で適用する(その後の「子は親より下」チェックが整合性を保証する)。
  {
    const siblingGroups = {};
    parentEdges.forEach(([p,c])=>{ (siblingGroups[p] = siblingGroups[p]||[]).push(c); });
    Object.values(siblingGroups).forEach(members=>{
      const m = Math.max(...members.map(id=>rank[id]));
      members.forEach(id=>{ rank[id] = m; });
    });
  }

  // 1) 各クラスタの「メンバー順」と「先頭メンバーからのオフセット」「子ID一覧」を先に確定する
  const clusterOrder = {}, clusterOffsets = {}, clusterChildIds = {};
  const alignWith = {};
  nodes.forEach(n=>{ if(n.alignWith) alignWith[n.id] = n.alignWith; });
  const leafRoots = [];
  const setupVisited = new Set();
  function setupCluster(startId){
    const root = clusterOf[startId];
    if(setupVisited.has(root)) return;
    setupVisited.add(root);
    const members = clusters[root].slice();
    members.sort((a,b)=> (a===startId? -1 : b===startId?1:0));
    clusterOrder[root] = members;
    const offsets=[0];
    for(let j=1;j<members.length;j++){
      const gap = pairGap[members[j-1]+"|"+members[j]] || SPOUSE_GAP;
      offsets.push(offsets[j-1]+gap);
    }
    clusterOffsets[root] = offsets;
    const childIds = [];
    members.forEach(m=> childrenOf[m].forEach(c=>{ if(!childIds.includes(c)) childIds.push(c); }));
    clusterChildIds[root] = childIds;
    if(childIds.length===0) leafRoots.push(root);
    childIds.forEach(c=> setupCluster(c));
  }
  nodes.forEach(n=>{ if(parentsOf[n.id].length===0) setupCluster(n.id); });
  nodes.forEach(n=>{ if(!setupVisited.has(clusterOf[n.id])) setupCluster(n.id); });

  // 2) 子を持たない人(葉)を、家系図をたどる順番のまま横に並べ、基準となる位置を与える
  const anchorX = {};
  let cursor = 0;
  leafRoots.forEach(root=>{
    anchorX[root] = cursor;
    cursor += clusterOffsets[root][clusterOffsets[root].length-1] + COL_W;
  });

  // 3) 子を持つ人の位置を、子どもたちの重心の真上になるよう計算する。
  //    「重なり解消(4)」で子の位置がずれることがあるため、3→4を数回繰り返して収束させる。
  function memberX(root, id){ return anchorX[root] + clusterOffsets[root][clusterOrder[root].indexOf(id)]; }
  const nonLeafRoots = Object.keys(clusterOrder)
    .filter(root=> clusterChildIds[root].length>0)
    .sort((a,b)=> rank[clusterOrder[b][0]] - rank[clusterOrder[a][0]]); // 深い世代(子側)から先に処理

  function recomputeNonLeafAnchors(){
    nonLeafRoots.forEach(root=>{
      const members = clusterOrder[root];
      const alignTarget = members.map(m=>alignWith[m]).find(Boolean);
      let avg;
      if(alignTarget && clusterOf[alignTarget] !== undefined){
        avg = memberX(clusterOf[alignTarget], alignTarget); // 子孫の重心の代わりに、指定された特定の子孫とx座標を揃える
      } else {
        const childXs = clusterChildIds[root].map(id=> memberX(clusterOf[id], id));
        avg = childXs.reduce((a,b)=>a+b,0)/childXs.length;
      }
      const offsets = clusterOffsets[root];
      const centroidOffset = offsets.reduce((a,b)=>a+b,0)/offsets.length;
      anchorX[root] = avg - centroidOffset;
    });
  }

  // 4) 同じ段(世代)の中で重なっているクラスタだけを、位置が近い順に並べて間隔を確保する
  function resolveOverlaps(){
    const byRank = {};
    Object.keys(clusterOrder).forEach(root=>{
      const r = rank[clusterOrder[root][0]];
      (byRank[r] = byRank[r]||[]).push(root);
    });
    Object.values(byRank).forEach(roots=>{
      roots.sort((a,b)=> anchorX[a]-anchorX[b]);
      for(let i=1;i<roots.length;i++){
        const prevRoot=roots[i-1], curRoot=roots[i];
        const prevRight = anchorX[prevRoot] + clusterOffsets[prevRoot][clusterOffsets[prevRoot].length-1];
        const curLeft = anchorX[curRoot];
        if(curLeft - prevRight < COL_W){
          anchorX[curRoot] += COL_W - (curLeft - prevRight);
        }
      }
    });
  }

  for(let iter=0; iter<8; iter++){
    recomputeNonLeafAnchors();
    resolveOverlaps();
  }

  // 5) 各段(世代)ごとに、直系(trunk)を中心に配置し直す。
  //    ・配偶者はクラスタとして直系にすでに隣接しているが、複数いる場合は上下にもずらす
  //    ・同じ家に留まる兄弟姉妹は、直系の左右にバランスよく交互配置し、上下にもずらす
  //    ・他家へ嫁いだ・養子に出た人物は、行き先の家ごとにまとまりを作りつつ、さらに外側へ配置する
  const nodeX = {}, nodeY = {};
  const rootsByRank = {};
  Object.keys(clusterOrder).forEach(root=>{
    const r = rank[clusterOrder[root][0]];
    (rootsByRank[r] = rootsByRank[r]||[]).push(root);
  });
  const JITTER = ROW_H * 0.22, GAP_INNER = COL_W * 1.05, GAP_OUTER = COL_W * 0.9;

  function clusterWidth(root){ const o=clusterOffsets[root]; return o[o.length-1]; }
  function clusterAnchorMember(root){
    const members = clusterOrder[root];
    return members.find(m=> nodeByIdLocal[m] && nodeByIdLocal[m].trunk) || members[0];
  }
  function clusterIsTrunkHouse(root){
    return clusterOrder[root].some(m=> nodeByIdLocal[m] && nodeByIdLocal[m].house === TRUNK_HOUSE);
  }
  function clusterJoinedHouse(root){
    const tagged = clusterOrder[root].map(m=> nodeByIdLocal[m] && nodeByIdLocal[m].joinedHouse).find(Boolean);
    return tagged || null;
  }
  function clusterGroupKey(root){
    // 明示的に「他家へ出た」印があればそれを使う。
    // 血縁がそもそも主題の家でない場合(たまたま同じ段になっただけの別系統)は、
    // その人自身の家をグループキーとして扱う。血縁が主題の家のまま残る場合のみ null(留まる兄弟)。
    const joined = clusterJoinedHouse(root);
    if(joined) return joined;
    if(!clusterIsTrunkHouse(root)){
      const first = nodeByIdLocal[clusterOrder[root][0]];
      return (first && first.house) || "other";
    }
    return null;
  }

  const groupSideMemory = {}; // 家グループ(joinedHouse等)ごとに割り当てた左右を覚えておき、世代をまたいで揃える
  const finalizedRanks = new Set();

  // 直系(trunk)が実際にどの段にいるかを求め、そこから近い段の順に処理する。
  // これにより「直系のいる段(常にx=0中心)」と「直系のいない段(先祖・子孫)」の
  // 基準がずれず、隣の段とのつながりを頼りに全体を秀吉中心にそろえられる。
  const anyTrunkId = ids.find(id=> nodeByIdLocal[id] && nodeByIdLocal[id].trunk);
  const trunkRankValue = anyTrunkId!==undefined ? rank[anyTrunkId] : 0;
  const orderedRanks = Object.keys(rootsByRank).map(Number)
    .sort((a,b)=> Math.abs(a-trunkRankValue) - Math.abs(b-trunkRankValue));

  orderedRanks.forEach(r=>{
    const roots = rootsByRank[r].slice();
    const trunkRoot = roots.find(root=> clusterOrder[root].some(m=> nodeByIdLocal[m] && nodeByIdLocal[m].trunk));

    if(!trunkRoot){
      // 直系がいない段(祖先や子孫の段)も、x=0から詰め直すのではなく、
      // 緩和法で計算済みの重心(anchorX)の中心を保ったまま並べ直す。
      roots.sort((a,b)=> anchorX[a]-anchorX[b]);
      const totalWidth = roots.reduce((sum,root)=> sum + clusterWidth(root) + COL_W, -COL_W);
      const origLeft = Math.min(...roots.map(root=> anchorX[root]));
      const origRight = Math.max(...roots.map(root=> anchorX[root] + clusterWidth(root)));
      const origCenter = (origLeft + origRight) / 2;
      let curX = origCenter - totalWidth/2;
      roots.forEach(root=>{
        clusterOrder[root].forEach((m,j)=>{ nodeX[m]=curX+clusterOffsets[root][j]; nodeY[m]=r*ROW_H; });
        curX += clusterWidth(root)+COL_W;
      });
      // 同じ段に複数の無関係な系統(例:主人公の実家と、配偶者の実家)が混在することがあるため、
      // 段全体をまとめて動かすのではなく、系統(クラスタ)ごとに個別へ、直系に一段近い側の
      // 段とのつながりを探してそろえる。つながりが無いクラスタは、他とぶつからない範囲で
      // そのままにする。
      // 直系(秀吉)を含む段を基準(距離0)として処理しているため、まだ確定していない段の
      // 相手は無視し、既に確定済みの段にいる相手だけを対象に、つながる全員の平均位置へ
      // クラスタの中心を合わせる。子(または親)が複数の異なる段に分かれている場合もあるため、
      // 「隣の段」に限らず、確定済みの段ならどこでも対象にする。
      roots.forEach(root=>{
        const relatedXs = [];
        clusterOrder[root].forEach(mid=>{
          const relatedIds = [...(childrenOf[mid]||[]), ...(parentsOf[mid]||[])];
          relatedIds.forEach(relId=>{
            if(finalizedRanks.has(rank[relId]) && nodeX[relId] !== undefined) relatedXs.push(nodeX[relId]);
          });
        });
        if(relatedXs.length){
          const targetX = relatedXs.reduce((a,b)=>a+b,0) / relatedXs.length;
          const clusterMemberXs = clusterOrder[root].map(mid=>nodeX[mid]);
          const clusterCenter = (Math.min(...clusterMemberXs) + Math.max(...clusterMemberXs)) / 2;
          const offset = targetX - clusterCenter;
          clusterOrder[root].forEach(mid=>{ nodeX[mid] += offset; });
        }
      });
      {
        // 個別にずらした結果、同じ段の中で近づきすぎたクラスタがあれば軽く押し出す
        const sortedRoots = roots.slice().sort((a,b)=> nodeX[clusterOrder[a][0]] - nodeX[clusterOrder[b][0]]);
        for(let i=1;i<sortedRoots.length;i++){
          const prev = sortedRoots[i-1], cur = sortedRoots[i];
          const prevRight = Math.max(...clusterOrder[prev].map(mid=>nodeX[mid])) + COL_W*0.5;
          const curLeftMembers = clusterOrder[cur];
          const curLeftBase = Math.min(...curLeftMembers.map(mid=>nodeX[mid]));
          if(curLeftBase < prevRight){
            const push = prevRight - curLeftBase;
            curLeftMembers.forEach(mid=>{ nodeX[mid] += push; });
          }
        }
      }
      finalizedRanks.add(r);
      return;
    }

    const others = roots.filter(root=> root!==trunkRoot);
    const stayers = others.filter(root=> clusterGroupKey(root)===null).sort((a,b)=> anchorX[a]-anchorX[b]);
    const leavers = others.filter(root=> clusterGroupKey(root)!==null);
    const leaverGroups = {};
    leavers.forEach(root=>{ (leaverGroups[clusterGroupKey(root)] = leaverGroups[clusterGroupKey(root)]||[]).push(root); });
    Object.values(leaverGroups).forEach(g=> g.sort((a,b)=> anchorX[a]-anchorX[b]));

    // 直系クラスタ自身(配偶者含む)を中央に据える。配偶者が複数いれば上下にずらす。
    const trunkMembers = clusterOrder[trunkRoot];
    const trunkOffsets = clusterOffsets[trunkRoot];
    const trunkAnchorIdx = trunkMembers.indexOf(clusterAnchorMember(trunkRoot));
    const centerOffset = trunkOffsets[trunkAnchorIdx];
    trunkMembers.forEach((m,j)=>{
      nodeX[m] = trunkOffsets[j] - centerOffset;
      nodeY[m] = (j===trunkAnchorIdx) ? r*ROW_H : r*ROW_H + (j%2===0 ? -JITTER : JITTER);
    });

    let leftCursor = Math.min(...trunkMembers.map(m=>nodeX[m])) - GAP_INNER;
    let rightCursor = Math.max(...trunkMembers.map(m=>nodeX[m])) + GAP_INNER;
    let toggle = 0, jitterToggle = 0;

    function placeOnSide(root, isLeft, gapExtra, useJitter){
      const w = clusterWidth(root), offsets = clusterOffsets[root];
      const baseX = isLeft ? (leftCursor - w) : rightCursor;
      const yOff = useJitter ? (jitterToggle%2===0 ? -JITTER : JITTER) : 0;
      clusterOrder[root].forEach((m,j)=>{ nodeX[m] = baseX + offsets[j]; nodeY[m] = r*ROW_H + yOff; });
      jitterToggle++;
      if(isLeft){ leftCursor = baseX - gapExtra; } else { rightCursor = baseX + w + gapExtra; }
    }

    // 留まる兄弟姉妹をバランスよく左右交互に(斜め上下のジッター付き)
    stayers.forEach(root=>{ placeOnSide(root, toggle%2===0, COL_W, true); toggle++; });

    // 他家へ出た人物は、行き先の家ごとにまとめて、さらに外側へ配置する。
    // 同じ家は世代をまたいでも同じ側になるよう、一度決めた左右を記憶して使い回す。
    const leaverKeys = Object.keys(leaverGroups).sort();
    leaverKeys.forEach(key=>{
      const group = leaverGroups[key];
      let isLeft;
      if(groupSideMemory[key] !== undefined){
        isLeft = groupSideMemory[key];
      } else {
        isLeft = toggle%2===0;
        groupSideMemory[key] = isLeft;
      }
      group.forEach((root,gi)=> placeOnSide(root, isLeft, gi===group.length-1 ? GAP_OUTER : COL_W, false));
      toggle++;
    });
    finalizedRanks.add(r);
  });

  // compactBranch:true を付けた人物の子孫は、世代(段)にとらわれず近くにまとめて配置する。
  // 見やすさを優先する小さな分家(宮家など)向けの機能。配偶者クラスタ単位で動かすことで、
  // 夫婦が離れ離れにならないようにする。他の配置とぶつからないよう、
  // 動かした人物どうしの重なりだけ簡易的に押し出して解消する。
  // 間隔は人物ごとに調整可能:
  //   compactSpacingX … 横方向の間隔の倍率(既定 1.4。混み合う場合は大きく、余裕があれば小さく)
  //   compactGapY      … 縦方向の間隔の倍率(既定 0.55。段の高さに対する割合)
  const movedIds = new Set();
  nodes.filter(n=>n.compactBranch).forEach(founder=>{
    const founderCluster = clusterOf[founder.id];
    const fx = nodeX[founder.id], fy = nodeY[founder.id];
    let frontierClusters = [founderCluster];
    const visitedClusters = new Set([founderCluster]);
    const spacingX = COL_W * (founder.compactSpacingX!=null ? founder.compactSpacingX : 1.4);
    const SMALL_GAP = ROW_H * (founder.compactGapY!=null ? founder.compactGapY : 0.55);
    let depth = 0;
    while(true){
      depth++;
      const nextClusters = [];
      const seenThisLevel = new Set();
      frontierClusters.forEach(fc=>{
        (clusters[fc]||[]).forEach(memberId=>{
          (childrenOf[memberId]||[]).forEach(childId=>{
            const cc = clusterOf[childId];
            if(!visitedClusters.has(cc) && !seenThisLevel.has(cc)){
              seenThisLevel.add(cc); nextClusters.push(cc); visitedClusters.add(cc);
            }
          });
        });
      });
      if(nextClusters.length===0) break;
      const y = fy + SMALL_GAP*depth;
      // 直系(trunk)を含むクラスタは、他の論理で既に正しく配置されているので動かさない。
      // かつ、そこから先(その子孫)へは探索を打ち切る(でないと、直系の子孫まで
      // このコンパクト化に巻き込まれ、誤った浅い位置に配置されてしまう)。
      const prunedClusters = nextClusters.filter(cc=>{
        const members = clusterOrder[cc] || [cc];
        return !members.some(mid=> nodeByIdLocal[mid] && nodeByIdLocal[mid].trunk);
      });
      prunedClusters.forEach((cc,i2)=>{
        let offset;
        if(founder.compactSide === 'left'){
          offset = -(i2+1) * spacingX;
        } else if(founder.compactSide === 'right'){
          offset = (i2+1) * spacingX;
        } else {
          offset = (i2 - (prunedClusters.length-1)/2) * spacingX;
        }
        const members = clusterOrder[cc] || [cc];
        const offsets = clusterOffsets[cc] || [0];
        members.forEach((mid,j)=>{
          nodeX[mid] = fx + offset + (offsets[j]||0);
          nodeY[mid] = y;
          movedIds.add(mid);
        });
      });
      frontierClusters = prunedClusters;
    }
  });
  if(movedIds.size){
    const CARD_W = COL_W*0.9, CARD_H = ROW_H*0.36;
    for(let iter=0; iter<15; iter++){
      let moved=false;
      for(let i=0;i<ids.length;i++){
        for(let j=i+1;j<ids.length;j++){
          const a=ids[i], b=ids[j];
          if(!movedIds.has(a) && !movedIds.has(b)) continue; // 動かした側が関わるペアだけ調べる
          const dx = nodeX[a]-nodeX[b], dy = nodeY[a]-nodeY[b];
          if(Math.abs(dx) < CARD_W && Math.abs(dy) < CARD_H){
            const push = (CARD_W - Math.abs(dx))/2 + 4;
            if(dx>=0){ nodeX[a]+=push; nodeX[b]-=push; } else { nodeX[a]-=push; nodeX[b]+=push; }
            moved = true;
          }
        }
      }
      if(!moved) break;
    }
  }

  // 系図の基本原則:子(養子含む)は必ず親より下に表示する。
  // compactBranch等の調整で、複数の親(実父・養父など)を持つ人物の位置が
  // どちらか一方の親より浅くなってしまった場合は、深い方の親のすぐ下まで押し下げる。
  {
    let fixed = true;
    for(let guard=0; guard<10 && fixed; guard++){
      fixed = false;
      parentEdges.forEach(([p,c])=>{
        if(nodeY[c] === undefined || nodeY[p] === undefined) return;
        const minChildY = nodeY[p] + ROW_H*0.5;
        if(nodeY[c] < minChildY){
          const shift = minChildY - nodeY[c];
          const cc = clusterOf[c];
          (clusterOrder[cc]||[c]).forEach(mid=>{ nodeY[mid] += shift; });
          fixed = true;
        }
      });
    }
  }

  // 最終安全策:ここまでの各種調整でも、たまたま近すぎてしまったペアがあれば軽く押し出す。
  // 直系(trunk)の位置だけは動かさない。
  {
    const CARD_W = 158, CARD_H = 100;
    for(let iter=0; iter<15; iter++){
      let moved=false;
      for(let i=0;i<ids.length;i++){
        for(let j=i+1;j<ids.length;j++){
          const a=ids[i], b=ids[j];
          const dx = nodeX[a]-nodeX[b], dy = nodeY[a]-nodeY[b];
          if(Math.abs(dx) < CARD_W && Math.abs(dy) < CARD_H){
            const aTrunk = !!(nodeByIdLocal[a] && nodeByIdLocal[a].trunk);
            const bTrunk = !!(nodeByIdLocal[b] && nodeByIdLocal[b].trunk);
            const push = (CARD_W - Math.abs(dx))/2 + 4;
            if(aTrunk && !bTrunk){ nodeX[b] += (dx>=0 ? -push*2 : push*2); }
            else if(bTrunk && !aTrunk){ nodeX[a] += (dx>=0 ? push*2 : -push*2); }
            else if(!aTrunk && !bTrunk){
              if(dx>=0){ nodeX[a]+=push; nodeX[b]-=push; } else { nodeX[a]-=push; nodeX[b]+=push; }
            }
            moved = true;
          }
        }
      }
      if(!moved) break;
    }
  }

  return Object.fromEntries(ids.map(id=>[id, {x:nodeX[id], y:nodeY[id]}]));
}

/* ---- 親子線・婚姻線:カードの縁から、繋がる相手の方向へ向けてまっすぐ線を引く ----
   ドラッグでカードの位置が変わっても、常に直線のまま追従する。 */
const CARD_HW = 80, CARD_HH = 52; // カード(158px×約100px)のおおよその半分のサイズ
function anchorPoint(cx,cy,tx,ty){
  const dx=tx-cx, dy=ty-cy;
  if(dx===0 && dy===0) return [cx,cy];
  const sx = dx!==0 ? CARD_HW/Math.abs(dx) : Infinity;
  const sy = dy!==0 ? CARD_HH/Math.abs(dy) : Infinity;
  const s = Math.min(sx,sy,1);
  return [cx+dx*s, cy+dy*s];
}
function cardEdgePoints(A,B){
  const [ax,ay]=pt(A), [bx,by]=pt(B);
  const [x1,y1] = anchorPoint(ax,ay,bx,by);
  const [x2,y2] = anchorPoint(bx,by,ax,ay);
  return [x1,y1,x2,y2];
}

    const dash = kind==='marriage' ? 'stroke-dasharray="2 5" stroke-width="2.4"' : 'stroke-dasharray="3 5" stroke-width="1.3"';
    svgHTML += `<g class="edge" data-a="${aId}" data-b="${bId}">
      <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" ${dash} opacity="0.75"/>
      ${edgeLabel((x1+x2)/2, (y1+y2)/2-8, label)}

}

const panel = document.getElementById('panel');
let lastSelectedId = null;

function connectedIds(id){
  const s = new Set([id]);
  // 配偶者
  spouseEdges.forEach(([a,b])=>{ if(a===id) s.add(b); if(b===id) s.add(a); });
  // 直接の子(これまで通り、1世代分)
  parentEdges.forEach(([a,b])=>{ if(a===id) s.add(b); });
  // 直系先祖:父母から、さらにその父母…と何世代でもさかのぼる(実子・養子とも)
  (function addAncestors(personId){
    parentEdges.forEach(([p,c])=>{
      if(c===personId && !s.has(p)){
        s.add(p);
        addAncestors(p);
      }
    });
  })(id);
  return s;
}

/* ---------- 編集モード:カードをドラッグして位置を手動指定する ---------- */
const DRAG_THRESHOLD = 4; // これ未満の移動は「クリック」として扱う
function startNodeDrag(e, n, el){
  const [wx, wy] = pt(n);
  dragState = { id:n.id, el, startClientX:e.clientX, startClientY:e.clientY, startWorldX:wx, startWorldY:wy, curWorldX:wx, curWorldY:wy, moved:false };
  el.classList.add('being-dragged');
}
window.addEventListener('mousemove',(e)=>{
  if(!dragState) return;
  const dx = (e.clientX - dragState.startClientX)/scale;
  const dy = (e.clientY - dragState.startClientY)/scale;
  if(Math.hypot(e.clientX-dragState.startClientX, e.clientY-dragState.startClientY) > DRAG_THRESHOLD) dragState.moved = true;
  dragState.curWorldX = dragState.startWorldX + dx;
  dragState.curWorldY = dragState.startWorldY + dy;
  dragState.el.style.left = dragState.curWorldX+"px";
  dragState.el.style.top = dragState.curWorldY+"px";
});
window.addEventListener('mouseup',()=>{
  if(!dragState) return;
  const moved = dragState.moved;
  const id = dragState.id;
  const el = dragState.el;

  if(moved){
    const n = nodeById[id];
    const oldX = n.x, oldY = n.y;
    const newX = dragState.curWorldX - OFX;
    const newY = dragState.curWorldY - OFY;
    n.x = newX; n.y = newY;
    manualOverrides[id] = { x: Math.round(n.x), y: Math.round(n.y) };

    const dx = newX-oldX, dy = newY-oldY;
    const cascadeEl = document.getElementById('cascadeChildren');
    if(cascadeEl && cascadeEl.checked && (dx||dy)){
      const stack = [...childrenOfGlobal[id]];
      const visited = new Set();
      while(stack.length){
        const cid = stack.pop();
        if(visited.has(cid)) continue;
        visited.add(cid);
        if(manualPositions[cid] || manualOverrides[cid]) continue; // 既に個別指定済みならそこで追従を止める
        const cn = nodeById[cid];
        cn.x += dx; cn.y += dy;
        manualOverrides[cid] = { x: Math.round(cn.x), y: Math.round(cn.y) };
        childrenOfGlobal[cid].forEach(gc=> stack.push(gc));
      }
    }
    justDragged = true;
    setTimeout(()=>{ justDragged=false; }, 0);
  } else {
    el.style.left = (dragState.startWorldX)+"px";
    el.style.top = (dragState.startWorldY)+"px";
  }

  el.classList.remove('being-dragged');
  dragState = null;
  if(moved) renderAll();
});

function jsString(s){ return JSON.stringify(s); }

function nodeLiteral(n){
  const parts = [
    `id:${jsString(n.id)}`, `name:${jsString(n.name)}`, `house:${jsString(n.house)}`,
    `role:${jsString(n.role||'')}`,
  ];
  if(n.yomi) parts.push(`yomi:${jsString(n.yomi)}`);
  parts.push(`certainty:${jsString(n.certainty||'uncertain')}`);
  if(n.unnamed) parts.push(`unnamed:true`);
  parts.push(`note:${jsString(n.note||'')}`);
  parts.push(`sources:${jsString(n.sources||[])}`);
  return `  {${parts.join(", ")}},`;
}
function edgeLiteral(e){ return `  [${e.map(v=>jsString(v)).join(", ")}],`; }

document.getElementById('copyPositionsBtn').addEventListener('click', ()=>{
  const posIds = Object.keys(manualOverrides); // 新規追加分もここに含める(①に座標を書く)
  const contentIds = Object.keys(contentOverrides);
  const addedIds = [...addedNodeIds];
  const box = document.getElementById('copyOutput');
  const titleEl = document.getElementById('mainTitle');
  const subtitleEl = document.getElementById('mainSubtitle');
  const titleChanged = titleEl && titleEl.dataset.orig !== undefined && titleEl.textContent !== titleEl.dataset.orig;
  const subtitleChanged = subtitleEl && subtitleEl.dataset.orig !== undefined && subtitleEl.textContent !== subtitleEl.dataset.orig;
  const nothing = posIds.length===0 && contentIds.length===0 && addedIds.length===0
    && addedParentEdges.length===0 && addedSpouseEdges.length===0 && deletedIds.size===0
    && removedParentEdges.length===0 && removedSpouseEdges.length===0
    && !titleChanged && !subtitleChanged;
  if(nothing){
    box.value = '(まだ何も変更していません)';
  } else {
    let out = "";
    if(posIds.length){
      const lines = posIds.map(id=> `  "${id}": {x: ${manualOverrides[id].x}, y: ${manualOverrides[id].y}},`);
      out += "// ① manualPositions の中に貼り付け(新しく追加した人物の座標も含む)\nconst manualPositions = {\n" + lines.join("\n") + "\n};\n\n";
    }
    if(contentIds.length){
      const lines = contentIds.map(id=>{
        const fields = Object.entries(contentOverrides[id]).map(([k,v])=> `${k}: ${jsString(v)}`).join(", ");
        return `  "${id}": {${fields}},`;
      });
      out += "// ② contentOverrides の中に貼り付け\nconst contentOverrides = {\n" + lines.join("\n") + "\n};\n\n";
    }
    if(addedIds.length){
      const lines = addedIds.map(id=> nodeLiteral(nodeById[id]));
      out += "// ③ nodes 配列の末尾(閉じ「];」の直前)に貼り付け(座標は①へ別途記載済み)\n" + lines.join("\n") + "\n\n";
    }
    if(addedParentEdges.length){
      out += "// ④ parentEdges 配列の末尾に貼り付け\n" + addedParentEdges.map(edgeLiteral).join("\n") + "\n\n";
    }
    if(addedSpouseEdges.length){
      out += "// ⑤ spouseEdges 配列の末尾に貼り付け\n" + addedSpouseEdges.map(edgeLiteral).join("\n") + "\n\n";
    }
    if(deletedIds.size){
      out += "// ⑥ 以下のIDを nodes 配列、および parentEdges・spouseEdges 配列の中から\n"
           + "//    (このIDが含まれる行ごと)手動で削除してください\n"
           + "// 削除対象: " + [...deletedIds].map(jsString).join(", ") + "\n\n";
    }
    if(removedParentEdges.length){
      out += "// ⑦ parentEdges 配列から、以下と同じ内容の行を探して削除してください\n"
           + removedParentEdges.map(edgeLiteral).join("\n") + "\n\n";
    }
    if(removedSpouseEdges.length){
      out += "// ⑧ spouseEdges 配列から、以下と同じ内容の行を探して削除してください\n"
           + removedSpouseEdges.map(edgeLiteral).join("\n") + "\n\n";
    }
    if(titleChanged || subtitleChanged){
      out += "// ⑨ HTML内の <div class=\"title\"> の行を、以下に置き換えてください\n"
           + `<div class="title"><span id="mainTitle" contenteditable="true" spellcheck="false">${titleEl.textContent}</span><small id="mainSubtitle" contenteditable="true" spellcheck="false">${subtitleEl.textContent}</small></div>`;
    }
    box.value = out.trim();
  }
  box.style.display='block';
  box.select();
  try{ navigator.clipboard.writeText(box.value); }catch(err){}
});

function removeNodeCompletely(id){
  const idx = nodes.findIndex(n=>n.id===id);
  if(idx>=0) nodes.splice(idx,1);
  delete nodeById[id];
  delete childrenOfGlobal[id];
  Object.keys(childrenOfGlobal).forEach(p=>{ childrenOfGlobal[p] = childrenOfGlobal[p].filter(c=>c!==id); });
  for(let i=parentEdges.length-1;i>=0;i--){ if(parentEdges[i][0]===id || parentEdges[i][1]===id) parentEdges.splice(i,1); }
  for(let i=spouseEdges.length-1;i>=0;i--){ if(spouseEdges[i][0]===id || spouseEdges[i][1]===id) spouseEdges.splice(i,1); }
  for(let i=addedParentEdges.length-1;i>=0;i--){ if(addedParentEdges[i][0]===id || addedParentEdges[i][1]===id) addedParentEdges.splice(i,1); }
  for(let i=addedSpouseEdges.length-1;i>=0;i--){ if(addedSpouseEdges[i][0]===id || addedSpouseEdges[i][1]===id) addedSpouseEdges.splice(i,1); }
  delete manualOverrides[id];
  delete contentOverrides[id];
  delete originalNodeById[id];
  if(addedNodeIds.has(id)){ addedNodeIds.delete(id); }
  else { deletedIds.add(id); }
}

function removeParentEdgeIfExists(childId, label){
  const idx = parentEdges.findIndex(e=> e[1]===childId && e[3]==='blood' && e[2].includes(label));
  if(idx<0) return;
  const edge = parentEdges[idx];
  parentEdges.splice(idx,1);
  if(childrenOfGlobal[edge[0]]) childrenOfGlobal[edge[0]] = childrenOfGlobal[edge[0]].filter(c=>c!==childId);
  const addedIdx = addedParentEdges.indexOf(edge);
  if(addedIdx>=0) addedParentEdges.splice(addedIdx,1); else removedParentEdges.push(edge);
}
function addParentEdge(parentId, childId, label){
  const e = [parentId, childId, label, "blood"];
  parentEdges.push(e); addedParentEdges.push(e);
  if(!childrenOfGlobal[parentId]) childrenOfGlobal[parentId] = [];
  childrenOfGlobal[parentId].push(childId);
}
function removeSpouseEdgeIfExists(id){
  const idx = spouseEdges.findIndex(e=> e[0]===id || e[1]===id);
  if(idx<0) return;
  const edge = spouseEdges[idx];
  spouseEdges.splice(idx,1);
  const addedIdx = addedSpouseEdges.indexOf(edge);
  if(addedIdx>=0) addedSpouseEdges.splice(addedIdx,1); else removedSpouseEdges.push(edge);
}
function addSpouseEdge(id, otherId){
  const e = [id, otherId, "婚姻", "marriage"];
  spouseEdges.push(e); addedSpouseEdges.push(e);
}

document.getElementById('ef_save').addEventListener('click', ()=>{
  if(!editingId) return;
  const n = nodeById[editingId];
  const orig = originalNodeById[editingId];
  const vals = {
    name: document.getElementById('ef_name').value.trim() || '新しい人物',
    role: document.getElementById('ef_role').value.trim(),
    yomi: document.getElementById('ef_yomi').value.trim(),

  };
  Object.assign(n, vals);

  const newFatherId = efFather.value, newMotherId = efMother.value, newSpouseId = efSpouse.value;
  if(newFatherId !== currentFather(editingId)){
    removeParentEdgeIfExists(editingId, '父');
    if(newFatherId) addParentEdge(newFatherId, editingId, '父');
  }
  if(newMotherId !== currentMother(editingId)){
    removeParentEdgeIfExists(editingId, '母');
    if(newMotherId) addParentEdge(newMotherId, editingId, '母');
  }
  if(newSpouseId !== currentSpouse(editingId)){
    removeSpouseEdgeIfExists(editingId);
    if(newSpouseId) addSpouseEdge(editingId, newSpouseId);
  }

  if(!isNewNode){
    const diff = {};
    Object.keys(vals).forEach(k=>{
      const o = orig[k], v = vals[k];
      const same = Array.isArray(o) ? JSON.stringify(o||[])===JSON.stringify(v) : ((o||'')===v || (!o && !v));
      if(!same) diff[k] = v;
    });
    if(Object.keys(diff).length){ contentOverrides[editingId] = diff; } else { delete contentOverrides[editingId]; }

  document.getElementById('editForm').classList.remove('show');

function fitToView(animate){
  const rect = viewport.getBoundingClientRect();
  const s = Math.min(rect.width/worldW, rect.height/worldH) * 0.92;
  const targetScale = Math.max(0.15, Math.min(s, 1.4));
  const targetPanX = (rect.width - worldW*targetScale)/2;
  const targetPanY = (rect.height - worldH*targetScale)/2;
  if(animate){ animateTo(targetScale, targetPanX, targetPanY); }
  else { scale=targetScale; panX=targetPanX; panY=targetPanY; applyTransform(); }
}
function clampScale(s){ return Math.min(2.6, Math.max(0.15, s)); }

let panMoved = false;
viewport.addEventListener('mousedown',(e)=>{ cancelAnimation(); isDragging=true; panMoved=false; startX=e.clientX; startY=e.clientY; startPanX=panX; startPanY=panY; viewport.classList.add('dragging'); });
window.addEventListener('mousemove',(e)=>{ if(!isDragging) return; if(Math.hypot(e.clientX-startX,e.clientY-startY)>4) panMoved=true; panX=startPanX+(e.clientX-startX); panY=startPanY+(e.clientY-startY); applyTransform(); });
window.addEventListener('mouseup',()=>{ isDragging=false; viewport.classList.remove('dragging'); });

viewport.addEventListener('wheel',(e)=>{
  e.preventDefault();
  cancelAnimation();
  const rect = viewport.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const worldMX=(mx-panX)/scale, worldMY=(my-panY)/scale;
  scale = clampScale(scale*(e.deltaY<0?1.12:1/1.12));
  panX = mx-worldMX*scale; panY = my-worldMY*scale; applyTransform();
},{passive:false});

let touchStartDist=null, touchStartScale=1, touchStartMid=null;
viewport.addEventListener('touchstart',(e)=>{
  cancelAnimation();
  if(e.touches.length===1){ isDragging=true; panMoved=false; startX=e.touches[0].clientX; startY=e.touches[0].clientY; startPanX=panX; startPanY=panY; }
  else if(e.touches.length===2){ isDragging=false; const [t1,t2]=e.touches; touchStartDist=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY); touchStartScale=scale; touchStartMid={x:(t1.clientX+t2.clientX)/2,y:(t1.clientY+t2.clientY)/2}; }
},{passive:true});
viewport.addEventListener('touchmove',(e)=>{
  if(e.touches.length===1 && isDragging){ if(Math.hypot(e.touches[0].clientX-startX,e.touches[0].clientY-startY)>4) panMoved=true; panX=startPanX+(e.touches[0].clientX-startX); panY=startPanY+(e.touches[0].clientY-startY); applyTransform(); }
  else if(e.touches.length===2 && touchStartDist){
    e.preventDefault();
    const [t1,t2]=e.touches; const dist=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
    const rect=viewport.getBoundingClientRect(); const mx=touchStartMid.x-rect.left, my=touchStartMid.y-rect.top;
    const worldMX=(mx-panX)/scale, worldMY=(my-panY)/scale;
    scale=clampScale(touchStartScale*(dist/touchStartDist));
    panX=mx-worldMX*scale; panY=my-worldMY*scale; applyTransform();
  }
},{passive:false});
viewport.addEventListener('touchend',()=>{ isDragging=false; touchStartDist=null; });

document.getElementById('zoomIn').addEventListener('click',()=>{ cancelAnimation(); const r=viewport.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const wx=(mx-panX)/scale,wy=(my-panY)/scale; scale=clampScale(scale*1.2); panX=mx-wx*scale; panY=my-wy*scale; applyTransform(); });
document.getElementById('zoomOut').addEventListener('click',()=>{ cancelAnimation(); const r=viewport.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const wx=(mx-panX)/scale,wy=(my-panY)/scale; scale=clampScale(scale/1.2); panX=mx-wx*scale; panY=my-wy*scale; applyTransform(); });
document.getElementById('resetView').addEventListener('click', ()=>{ clearSelection(); fitToView(true); });

function focusOn(n){
  const rect = viewport.getBoundingClientRect();
  const [x,y] = pt(n);
  const targetPanX = rect.width/2 - x*scale;
  const targetPanY = rect.height/2 - y*scale;
  animateTo(scale, targetPanX, targetPanY);
}

/* ---------- 検索 ---------- */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  if(!q){ searchResults.style.display='none'; return; }
  const matches = nodes.filter(n=>n.name.includes(q));
  searchResults.innerHTML = matches.length ? matches.map(n=>`<div data-id="${n.id}">${n.name}<span style="color:#a89e8c;">　${n.role||''}</span></div>`).join("") : '<div style="color:#a89e8c;">該当なし</div>';
  searchResults.style.display='block';
});
searchResults.addEventListener('click',(e)=>{
  const t = e.target.closest('[data-id]'); if(!t) return;
  selectNode(t.getAttribute('data-id')); searchResults.style.display='none'; searchInput.value='';
});

/* ---------- 下部：アクセシブルな人物一覧 ---------- */
renderList();

/* ---------- 系図の表示エリアの高さをドラッグで変更 ---------- */
(function(){
  const handle = document.getElementById('resizeHandle');
  if(!handle) return;
  let startY = 0, startH = 0, dragging = false;
  handle.addEventListener('mousedown', (e)=>{
    dragging = true; startY = e.clientY; startH = viewport.getBoundingClientRect().height;
    handle.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const h = Math.max(280, Math.min(1400, startH + (e.clientY - startY)));
    viewport.style.height = h + 'px';
    fitToView();
  });
  window.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging = false; handle.classList.remove('dragging');
  });
  handle.addEventListener('touchstart', (e)=>{
    dragging = true; startY = e.touches[0].clientY; startH = viewport.getBoundingClientRect().height;
    handle.classList.add('dragging');
  }, {passive:true});
  window.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    const h = Math.max(280, Math.min(1400, startH + (e.touches[0].clientY - startY)));
    viewport.style.height = h + 'px';
    fitToView();
  }, {passive:true});
  window.addEventListener('touchend', ()=>{ dragging=false; handle.classList.remove('dragging'); });
})();

window.addEventListener('resize', ()=> fitToView());
fitToView();
</script>
